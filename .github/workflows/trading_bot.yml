name: Quant Bot market monitor

on:
  schedule:
    # GitHub Actions cron uses UTC. Hourly checks run near :07 from 00:00 through 22:00 UTC.
    - cron: "7 0-22 * * *"
    # Final analysis, session check, and EOD review.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Task to run manually"
        required: true
        type: choice
        default: hourly
        options: [hourly, sessions, eod, all]

permissions:
  contents: write

concurrency:
  group: quant-bot-market-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      NTFY_SERVER: https://ntfy.sh
      NTFY_TOPIC: Quantz-pro
      REFERENCE_EQUITY_USD: ${{ vars.REFERENCE_EQUITY_USD || '10000' }}
      RISK_FRACTION: ${{ vars.RISK_FRACTION || '0.005' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Select run mode
        id: mode
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 23 * * *" ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          else
            echo "mode=hourly" >> "$GITHUB_OUTPUT"
          fi
      - name: Run market analysis and notifications
        run: python bot.py --mode "${{ steps.mode.outputs.mode }}"
      - name: Persist forecast and performance state
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            git commit -m "Update Quant Bot analysis state [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "No persisted state changes."
          fi
